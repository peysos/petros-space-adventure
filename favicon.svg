<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#03040a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#a9fbff"/>
      <stop offset="1" stop-color="#31c9e6"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset="0.45" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ef9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <clipPath id="plate"><rect width="64" height="64" rx="13"/></clipPath>

  <!-- cabinet plate -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="12.5" fill="none" stroke="#ff1a1a" stroke-width="2" stroke-opacity=".9"/>

  <g clip-path="url(#plate)">
  <!-- starfield -->
  <g fill="#dff6ff">
    <rect x="11" y="14" width="2" height="2" opacity=".85"/>
    <rect x="50" y="20" width="2" height="2" opacity=".7"/>
    <rect x="17" y="43" width="2" height="2" opacity=".55"/>
    <rect x="46" y="45" width="2" height="2" opacity=".8"/>
  </g>

  <!-- engine glow + flame -->
  <circle cx="32" cy="48" r="20" fill="url(#glow)"/>
  <path d="M32 39 L38.5 47 L32 63 L25.5 47 Z" fill="url(#flame)"/>

  </g>

  <!-- ship (same silhouette as the in-game player) -->
  <path d="M32 8 L9 50 L32 42 L55 50 Z" fill="url(#hull)"/>
  <path d="M32 8 L9 50 L32 42 L55 50 Z" fill="none" stroke="#04121a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cockpit -->
  <path d="M32 17 L37.5 35 L32 31.5 L26.5 35 Z" fill="#ff1a1a"/>
</svg>
